[package]
name = "delete-me-desktop"
version = "0.0.1"
description = "delete-me desktop shell"
authors = ["Eric Thomson <eric.thomson13@gmail.com>"]
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "delete_me_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "io-util", "process", "macros"] }
anyhow = "1"
log = "0.4"
once_cell = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
