# Builds unsigned Tauri desktop bundles (DMG / MSI / AppImage) on tag push.
#
# This workflow deliberately does NOT do code signing — see docs/RELEASING.md
# for the manual signing/notarization playbook the maintainer runs against
# the artifacts this workflow produces.
#
# Trigger: push a tag matching v* (e.g. `git tag v0.1.0 && git push --tags`).
# Or trigger manually from the Actions tab via workflow_dispatch.
name: release-desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # for creating the GitHub release + uploading artifacts

jobs:
  build:
    name: ${{ matrix.target.label }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - label: macos-arm64
            runner: macos-14
            rust_target: aarch64-apple-darwin
            bundle_glob: "src-tauri/target/release/bundle/dmg/*.dmg"
          - label: linux-x86_64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            bundle_glob: "src-tauri/target/release/bundle/appimage/*.AppImage"
          - label: windows-x86_64
            runner: windows-2022
            rust_target: x86_64-pc-windows-msvc
            bundle_glob: "src-tauri/target/release/bundle/msi/*.msi"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.rust_target }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tauri-app/ui/pnpm-lock.yaml

      # Linux needs the GTK/webkit2gtk stack for AppImage builds.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf

      - name: Install Python sidecar dependencies
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --extra service --extra audit --extra dev

      - name: Build sidecar
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          scripts/build-sidecar.sh

      - name: Install UI dependencies
        run: pnpm --dir tauri-app/ui install --frozen-lockfile

      - name: Build Tauri bundle (unsigned)
        working-directory: tauri-app
        run: |
          cargo install tauri-cli --version "^2.0" --locked
          cargo tauri build --target ${{ matrix.target.rust_target }}

      - name: Upload bundle as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: delete-me-${{ matrix.target.label }}-unsigned
          path: tauri-app/${{ matrix.target.bundle_glob }}
          if-no-files-found: error

      - name: Attach bundle to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tauri-app/${{ matrix.target.bundle_glob }}
          draft: true
          body: |
            **Unsigned** build artifacts. See `docs/RELEASING.md` for the
            signing / notarization steps that need to run against these
            files before they are published to end users.
