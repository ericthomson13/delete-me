[project]
name = "delete-me"
version = "0.0.1"
description = "Open-source CCPA / state-DSAR / GDPR letter-sender and DROP compliance auditor for data brokers."
readme = "docs/README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
authors = [{ name = "Eric Thomson", email = "eric.thomson13@gmail.com" }]
keywords = ["privacy", "ccpa", "gdpr", "data-broker", "delete-act", "drop"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pydantic[email]>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "click>=8.1",
    "jsonschema>=4.21",
    "weasyprint>=62.0",
    "platformdirs>=4.2",
    "sqlmodel>=0.0.16",
    "httpx>=0.27",
]

[project.optional-dependencies]
service = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "arq>=0.25",
    "argon2-cffi>=23.1",
    "psycopg[binary]>=3.1",
]
audit = ["playwright>=1.43"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
delete-me = "delete_me.cli:main"

[project.urls]
Homepage = "https://github.com/extra-terrestrial-designs/delete-me"
Issues = "https://github.com/extra-terrestrial-designs/delete-me/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core-py/delete_me", "service/service"]

[tool.hatch.build.targets.sdist]
include = [
    "core-py",
    "service",
    "registry",
    "legal",
    "docs",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's canonical pattern is `Depends(get_session)` in argument defaults.
"service/service/api/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["core-py/tests", "service/service_tests"]
pythonpath = ["core-py", "service"]
