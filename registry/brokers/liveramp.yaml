notes: |
  Identity-graph aggregator (formerly Acxiom LiveRamp). Matches consumers
  by hashed email/phone, so providing those in the agent letter improves
  match rate. CPPA-registered, fans into many downstream adtech buyers.
  Sourced from CPPA complete-reg-data-brokers.csv (2026-05-20); CPPA's
  listed subdomain (my-privacy-choices.liveramp.com) is DNS-dead — use
  the canonical /opt_out/ page on the apex domain instead, which routes
  to region-specific "Your Privacy Choices" portals. Browser-verified
  2026-05-20: page reachable but lands on a portal/login surface rather
  than a direct form — confirm the regional submission flow works for
  the consumer's jurisdiction before relying on this for unattended
  sends.
